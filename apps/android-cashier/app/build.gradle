plugins {
    id "com.android.application"
}

android {
    namespace "app.kasirnusa.cashier"
    compileSdk 35

    defaultConfig {
        applicationId "app.kasirnusa.cashier"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "1.1.1-test"
        buildConfigField "String", "POS_ORIGIN", "\"https://kasir-nusa-pos.vercel.app\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
