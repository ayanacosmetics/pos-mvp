plugins {
    id "com.android.application"
}

def releaseSigning = [
    storeFile: System.getenv("KASIR_NUSA_KEYSTORE_FILE"),
    storePassword: System.getenv("KASIR_NUSA_KEYSTORE_PASSWORD"),
    keyAlias: System.getenv("KASIR_NUSA_KEY_ALIAS"),
    keyPassword: System.getenv("KASIR_NUSA_KEY_PASSWORD")
]
def releaseSigningConfigured = releaseSigning.values().every { it }
def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}

if (releaseRequested && !releaseSigningConfigured) {
    throw new GradleException(
        "Build release memerlukan KASIR_NUSA_KEYSTORE_FILE, " +
        "KASIR_NUSA_KEYSTORE_PASSWORD, KASIR_NUSA_KEY_ALIAS, dan " +
        "KASIR_NUSA_KEY_PASSWORD."
    )
}

android {
    namespace "app.kasirnusa.cashier"
    compileSdk 35

    defaultConfig {
        applicationId "app.kasirnusa.cashier"
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName "1.3.1"
        buildConfigField "String", "POS_ORIGIN", "\"https://app.nusapos.my.id\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
